[package]
name = "reqora-send"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Headless NDJSON sidecar for reqora-core: lets the Node CLI / MCP server use the desktop HTTP sending chain."
publish = false

[[bin]]
name = "reqora-send"
path = "src/main.rs"

[dependencies]
reqora-core = { path = "../reqora-core", default-features = false }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-std", "rt"] }
