name: 功能建议
description: 提议一个新能力或一处改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 issue 与 roadmap，避免重复。大改动建议先讨论方案再动手。
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述真实场景，而不只是想要的功能名
      placeholder: 在……流程里，现在必须……，导致……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
      placeholder: 希望能在……里……
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案或当前绕行方式
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - 协议与鉴权
        - 脚本 / 断言 / 测试编排
        - Mock / 文档 / 代码生成
        - 环境与凭据管理
        - 存储 / Git / 协作同步
        - CLI / CI / 发布分发
        - 界面与本地化
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交 PR 实现这个功能
          required: false
