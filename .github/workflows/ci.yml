name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; jobs that need more declare it locally.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck / test / build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Bun owns the lockfile; npm caching from setup-node is not needed.
          package-manager-cache: false
      - name: Install dependencies
        shell: bash
        run: bun ci
      - name: Verify generated contract artifacts
        shell: bash
        run: bun run contract:check
      - name: Typecheck
        shell: bash
        run: bun run typecheck
      - name: Unit tests
        shell: bash
        run: bun run test:unit
      - name: Build
        shell: bash
        run: bun run build

  e2e:
    name: E2E (opt-in / network tests)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        shell: bash
        run: bun ci
      - name: E2E tests
        shell: bash
        run: bun run test:e2e

  rust:
    name: Rust unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # reqwest 0.12 exposes the `http3` feature behind an unstable cfg.
      # The workspace opts into HTTP/3, so every rustc invocation needs it.
      RUSTFLAGS: --cfg reqwest_unstable
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri
      - name: Install Tauri system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Cargo tests
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

  backend:
    name: Backend (Gradle + real MySQL + HTTP/SSE smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: reqora
          MYSQL_USER: reqora
          MYSQL_PASSWORD: ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      REQORA_SERVER_PORT: 18080
      REQORA_DB_URL: "jdbc:mysql://127.0.0.1:3306/reqora?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC"
      REQORA_DB_USER: reqora
      REQORA_DB_PASSWORD: ci-password
      REQORA_JWT_SECRET: ci-only-jwt-secret-must-be-at-least-32-characters-long
      REQORA_ACCESS_TTL: 15m
      REQORA_REFRESH_TTL: 7d
      REQORA_CORS_ORIGINS: "http://localhost:1420,http://localhost:5173,tauri://localhost,http://tauri.localhost"
      REQORA_ADMIN_USERNAME: ciadmin
      REQORA_ADMIN_EMAIL: ciadmin@example.com
      REQORA_ADMIN_PASSWORD: ci-admin-password-123
      BASE_URL: http://127.0.0.1:18080
      SMOKE_ADMIN_PASSWORD: ci-admin-password-123
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 21

      - name: Gradle build and unit tests
        working-directory: server
        shell: bash
        # gradlew is intentionally not executable in git; invoke it via bash.
        run: bash ./gradlew build

      - name: Start server
        working-directory: server
        shell: bash
        run: |
          nohup bash ./gradlew bootRun > "$RUNNER_TEMP/reqora-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/reqora-server.pid"

      - name: Wait for readiness
        shell: bash
        run: |
          set -o pipefail
          for i in $(seq 1 90); do
            if curl -fsS --noproxy '*' http://127.0.0.1:18080/ready > /dev/null 2>&1; then
              echo "server ready"
              exit 0
            fi
            sleep 2
          done
          echo "server failed to become ready"
          tail -120 "$RUNNER_TEMP/reqora-server.log"
          exit 1

      - name: HTTP smoke (44 assertions)
        working-directory: server
        shell: bash
        run: node scripts/smoke.mjs

      - name: SSE version-change smoke
        working-directory: server
        shell: bash
        run: node scripts/smoke-events.mjs

      - name: Server log on failure
        if: failure()
        shell: bash
        run: tail -160 "$RUNNER_TEMP/reqora-server.log"

      - name: Stop server
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/reqora-server.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/reqora-server.pid")" || true
          fi
